name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - run: pnpm run -r --if-present test

  db-tests:
    name: RLS pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Seul le conteneur Postgres est nécessaire pour pgTAP — exclure le reste
      # (auth, storage, studio...) accélère nettement le job.
      - name: Start Supabase (DB only)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP tests
        run: supabase test db

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Les ~146 erreurs préexistantes sont gelées dans les eslint-suppressions.json
      # de chaque package (garde-fou anti-régression, voir apps/platform/eslint.config.mjs
      # et les fichiers homologues). Toute NOUVELLE violation fait échouer ce step.
      - run: pnpm lint

      # Vocabulaire design system (couleurs/rayons hors tokens.css) : l'existant
      # est gelé dans design-guard-baseline.json, toute NOUVELLE occurrence fait
      # échouer ce step. Voir .claude/rules/design.md §Garde-fou CI.
      - run: pnpm design:check

      # Références à des chemins introuvables dans la doctrine (CLAUDE.md,
      # .claude/rules/**, .claude/agents/**, docs/produit.md). Tolérance
      # zéro, pas de baseline. Voir .claude/rules/doctrine-guard.md.
      - run: pnpm context:check
