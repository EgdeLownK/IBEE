name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - run: pnpm run -r --if-present test

  db-tests:
    name: RLS pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Seul le conteneur Postgres est nécessaire pour pgTAP — exclure le reste
      # (auth, storage, studio...) accélère nettement le job.
      - name: Start Supabase (DB only)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP tests
        run: supabase test db

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # TEMPORAIRE — à retirer dès que les ~250 problèmes de lint préexistants
      # (apps/platform + packages/shared) sont traités par les lots de correction
      # dédiés. Voir _BRAIN-STATE.md §Dette. Cette étape doit redevenir bloquante
      # une fois ces lots faits — ne pas laisser ce continue-on-error traîner.
      - run: pnpm lint
        continue-on-error: true
